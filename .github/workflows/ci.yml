name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/validate_skill.py .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/travel_planner.py validate-request --input examples/trip_request.json
      - run: python scripts/travel_planner.py evaluate --input examples/itinerary.json
      - run: python scripts/travel_planner.py normalize-rail --input examples/rail_query.json --select --seat-class second_class
      - run: python scripts/travel_planner.py validate-flights --input examples/final_plan.json --skip-freshness
      - run: python scripts/travel_planner.py validate-plan --input examples/final_plan.json

  release-audit:
    name: Release audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck scripts/*.sh
      - run: bash scripts/audit_release.sh .
      - run: bash scripts/prepare_release.sh "${RUNNER_TEMP}/travel-planner-mvp"

  secret-history:
    name: Secret history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
