title = "Travel Planner secret scanning"

[extend]
useDefault = true

[[rules]]
id = "amap-api-key"
description = "Amap API key assigned to an Amap credential field"
regex = '''(?i)(amap[_-]?(?:api[_-]?)?key|高德(?:地图)?(?:api)?key)[\t "'=:]{1,32}([A-Za-z0-9]{20,64})'''
secretGroup = 2
entropy = 3.0
keywords = ["amap", "高德"]
tags = ["api", "amap"]
